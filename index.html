<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name = "description" content = "コーヒーテイスティングノート記録Webアプリケーション">
        <title>reCoder</title>
        <!--スマホの横幅表示に合わせるための設定-->
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <!--preconnectでドメインに事前接続。ページの読み込み速度向上に寄与-->
        <!--Content Delivery Networkでファイルを使える(フォント)-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Philosopher&display=swap" >

        <link rel = "icon" href = "images/logo.png">

        <!---icons-->
        <!--コーヒーカップやごみ箱などのアイコンを表示するためのライブラリ-->
        <!--アイコンを取り出すには、<i data-lucide="coffee"></i>のように書く-->
        <script src="https://unpkg.com/lucide@latest"></script>

        <!--jQueryの読み込み(ヘッダーの開閉メニューで使う)-->
        <script
        src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
        crossorigin="anonymous"></script>

        <!-- ?v=1 はキャッシュ対策(キャッシュバスティング)。-->
        <!-- ファイルの中身を更新したら v の数字を増やすと、ブラウザが「新しいファイル」と判断して読み直す。-->
        <link rel="stylesheet" href="styles/main.css?v=5">
        <link rel="stylesheet" href="styles/responsive.css?v=4">
        <link rel="stylesheet" href="styles/auth.css?v=3">
    </head>
    <body>
    <div id="app">
        <header class="glass-header">
            <!--開閉メニュー：メニューボタンを押すと左からドロワーがスライドインする -->
            <div class = "submenu">
                <button class = "action-btn menu-btn" id = "menu-box">
                    <i data-lucide="menu"></i>
                </button>
                <!-- 背景の暗幕。ドロワーを開いたときに表示され、タップで閉じる -->
                <div class = "drawer-overlay" id = "drawer-overlay"></div>
                <!-- 左から出てくるドロワー本体。CSSの left でアニメーションする -->
                <nav class = "submenu-content" id = "submenu-content">
                    <div class = "drawer-header">
                        <span class = "drawer-title font-english">MENU</span>
                        <button class = "drawer-close" id = "drawer-close">
                            <i data-lucide="x"></i>
                        </button>
                    </div>
                    <a href = "home.html" class = "submenu-item">ホーム</a>
                    <a href = "description.html" class = "submenu-item">ご利用ガイド</a>
                    <a href = "specialty-coffee.html" class = "submenu-item">スペシャルティコーヒーとは</a>
                    <a href = "privacy-policy.html" class = "submenu-item">プライバシーポリシー</a>
                </nav>
            </div>
            <div class="logo">
                <span>reCoder</span>
            </div>
        </header>

        <main class="main-content">
            <!--ログイン・新規登録の画面。ログイン済みの場合はhome.htmlへ自動で移動する-->
            <section id = "auth-page" class = "auth-container">
                <div class = "glass-card">
                    <h2 id = "auth-title">Welcome to reCoder.</h2>
                    <div class = "auth-form">
                        <input type = "email" id="auth-email" placeholder="メールアドレス">
                        <input type = "password" id = "auth-password" placeholder="パスワード(6文字以上)">
                        <p id = "auth-error" class = "error-message"></p>
                        <button id = "auth-submit-btn" class = "auth-btn">ログイン</button>
                    </div>
                    <div class = "auth-switch">
                        <span id = "auth-switch-text">アカウントをお持ちでないですか？</span>
                        <a id = "auth-switch-link">新規登録</a>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Firebase SDK -->
    <!-- Firebaseの機能を使うためのライブラリをgoogleのサーバーからダウンロード-->
    <!-- CDN(外部配信)のファイルはURLにバージョンが含まれるので ?v= は不要 -->
    <!-- このページはログインだけを行うので、firestore(データベース)は読み込まない -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <!-- Firebaseの初期化設定 -->
    <script src="js/firebase-config.js?v=2"></script>

    <!-- このページ専用のログイン処理 -->
    <script src="js/auth.js?v=4"></script>

    <!-- ヘッダーの開閉メニュー用(jQueryアニメーション) -->
    <script src="js/menu.js?v=3"></script>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
